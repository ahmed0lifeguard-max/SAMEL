<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#5f1626">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>صامل | لوحة النقاط</title>
<style>
:root{--bg:#faf6ef;--cd:#fff;--tx:#2b1a1e;--mu:#62535a;--ln:#e2d7c3;--bd:#85756f;--pr:#5f1626;--go:#c9a45c;--sf:#f3ebdc;--er:#a3201a;--ok:#17663a}
@media(prefers-color-scheme:dark){:root{--bg:#1b1215;--cd:#291a1f;--tx:#f3eae2;--mu:#c3b4b7;--ln:#4a3139;--bd:#9c868c;--pr:#e8b4be;--sf:#34212a;--er:#ff9c94;--ok:#7fd9a1}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}button,select,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 17px/1.7 'Cairo','Tajawal','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1,h2,h3{line-height:1.35}
h2{font-size:20px;margin:26px 0 10px;color:var(--pr)}
h3{font-size:17px;margin:16px 0 6px}
.top{background:#fff;text-align:center;padding:10px 12px 10px;border-block-end:3px solid var(--go)}
.top>img{height:60px;max-width:60%}.pl{display:flex;justify-content:center;align-items:center;gap:14px;max-width:560px;margin:0 auto 10px;padding-block-end:8px;border-block-end:1px solid #eadfcd}.pl img{width:46%;max-width:230px;height:auto}
.hero{background:#5f1626;color:#faf6ef;text-align:center;padding:20px 16px 24px}
.hero h1{margin:0;font-size:clamp(26px,6vw,38px);font-weight:800}
.hero p{margin:6px 0 0;color:#e3c98f;font-weight:700}
.hero small{display:block;margin-block-start:8px;color:#efe4d0;font-size:15px}
nav{display:flex;gap:8px;max-width:880px;margin:14px auto 0;padding:0 12px}
nav button,.subnav button{flex:1;min-height:48px;padding:8px 6px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
nav button.on,.subnav button.on{background:#5f1626;color:#faf6ef;border-color:#5f1626}
.subnav{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}.subnav button{min-width:30%}
main{max-width:880px;margin:0 auto;padding:4px 12px 28px}main.pb{padding-block-end:130px}
footer{max-width:880px;margin:0 auto;padding:16px 16px 28px;text-align:center;color:var(--mu);font-size:14px;border-block-start:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.card,.sc,.st,.state{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.card{display:flex;align-items:center;gap:12px}.card>div{flex:1}
.card small{display:block;color:var(--mu);font-size:14px}
.rk{width:36px;height:36px;border-radius:50%;background:var(--sf);color:var(--pr);display:grid;place-items:center;font-weight:800;flex:none}
.rk.t1{background:var(--go);color:#2b1a1e}
.pt{font-size:24px;font-weight:800;color:var(--pr)}
.tp{display:flex;align-items:center;gap:10px;padding:5px 0}.tp>span:first-of-type{flex:1;font-weight:700}.tp .pt{font-size:20px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block-end:8px}.sh span{color:var(--pr);font-weight:800}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cg.two{grid-template-columns:repeat(2,1fr)}
.ce{background:var(--sf);border-radius:8px;padding:6px 4px;text-align:center}.ce small{display:block;color:var(--mu);font-size:14px}.ce b{font-size:22px}
.sc{margin-block-end:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;padding:0}.chips span{background:var(--sf);border-radius:20px;padding:2px 12px;font-size:15px;color:var(--mu);font-weight:700}
.note{color:var(--mu);font-size:15px}
.state{margin:14px 0;color:var(--tx)}.state.er{border-color:var(--er);color:var(--er)}
.big{background:#5f1626;color:#faf6ef;border-radius:14px;padding:18px;margin:14px 0;text-align:center}
.big b{display:block;font-size:46px;line-height:1.2;color:#e3c98f}.big small{display:block;margin-block-start:6px;color:#efe4d0;font-size:15px}
.lvl{font-weight:800;margin-block-start:4px}
.bar{height:12px;background:rgba(255,255,255,.25);border-radius:8px;margin-block-start:12px;overflow:hidden}.bar i{display:block;height:100%;background:#e3c98f}
label{display:block;font-weight:700;font-size:15px;margin-block-end:4px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1.5px solid var(--bd);border-radius:10px;min-height:44px;padding:8px 10px;max-width:100%}
select.w,input.w,.fx select,.fx input,textarea,.slot select{width:100%}
textarea{min-height:150px}
.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}.ck input{width:22px;height:22px;min-height:0}
.b{font:inherit;font-weight:700;min-height:44px;padding:8px 18px;border-radius:10px;border:1.5px solid #5f1626;background:#5f1626;color:#faf6ef;cursor:pointer}
.b.g{background:var(--sf);color:var(--tx);border-color:var(--bd)}
.b.dg{background:var(--cd);color:var(--er);border-color:var(--er)}
.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:flex-end}.row .fx{flex:1;min-width:150px}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fg.two{grid-template-columns:repeat(2,1fr)}
@media(min-width:560px){.fg:not(.two){grid-template-columns:repeat(4,1fr)}}
.fl span{display:block;font-size:14px;color:var(--mu);font-weight:700}.fl select{width:100%}
.gs{background:var(--sf);border-radius:12px;padding:8px 10px;margin:12px 0}.gs summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--pr)}
.gs .st{margin:8px 0}.st[hidden]{display:none}.ge{background:var(--cd);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px}
.slot{display:flex;gap:8px;align-items:center;margin:8px 0}.slot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--cd);border:1px solid var(--ln);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--pr)}
details.hw{background:var(--cd);border:1px solid var(--ln);border-radius:10px;padding:6px 14px;margin-block-start:18px}details.hw summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
ol{padding-inline-start:22px}
.bar2{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-block-start:2px solid var(--go);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;z-index:5;flex-wrap:wrap}
.bar2 #sm{flex:1;min-width:140px;font-size:15px}.er{color:var(--er);font-weight:700}.ok{color:var(--ok);font-weight:700}
.msg{color:var(--er);font-weight:700;min-height:1.7em}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 8px}
.pd{flex:1;max-width:160px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center}
.pd .md{font-size:32px;line-height:1.2}.pd b{font-size:15px;line-height:1.3;overflow-wrap:anywhere}.pd .pp{font-size:24px;font-weight:800;color:var(--pr);line-height:1.3}
.pd i{display:block;width:100%;border-radius:10px 10px 0 0;margin-top:4px;transform-origin:bottom;animation:rise .7s ease-out}.p1 i{height:96px}.p2 i{height:66px}.p3 i{height:44px}
.gc{background:var(--cd);border:1px solid var(--ln);border-inline-start:7px solid var(--c);border-radius:12px;padding:10px 14px;margin-block-end:10px}
.gc .sh{margin:0}.gc .sh>div{flex:1}.gc small{color:var(--mu);font-size:14px;display:block}
.gb{height:10px;background:var(--sf);border-radius:6px;overflow:hidden;margin:8px 0 6px}.gb i{display:block;height:100%;border-radius:6px;background:var(--c);transform-origin:right;animation:grow .8s ease-out}
@keyframes grow{from{transform:scaleX(0)}}@keyframes rise{from{transform:scaleY(0)}}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.fr{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px;margin:6px 0}.fr>span{font-size:14px;font-weight:700;color:var(--mu)}
.seg{display:flex;gap:6px}.sb{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;padding:0}
.sb.on{background:#5f1626;color:#faf6ef;border-color:#5f1626}
.b.wide{width:100%;margin:10px 0 4px}.b.sm{min-height:44px;padding:4px 14px;font-size:15px}
.chipz{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{min-height:44px;padding:6px 14px;border-radius:22px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.chip.in{background:#5f1626;color:#faf6ef;border-color:#5f1626}
.agz{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}@media(min-width:560px){.agz{grid-template-columns:repeat(3,1fr)}}
.ag{min-height:52px;border-radius:10px;border:1.5px solid var(--bd);border-inline-start:7px solid var(--c);background:var(--cd);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;padding:4px 8px}
.ag.on{background:#5f1626;color:#faf6ef}
.say{margin-block-start:12px;background:#f6e7c4;border-radius:12px;padding:12px 14px;font-weight:800;font-size:19px;line-height:1.6;color:#3a0d17}
.say2,.gsay{display:block;font-weight:800;color:#3a0d17!important;background:#f6e7c4;border-radius:10px;padding:8px 12px;font-size:17px!important;line-height:1.6;margin:8px 0 0}
.fxo{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:9}
.fxo span{position:absolute;top:-12%;animation:fall linear forwards}.fxo span.up{top:auto;bottom:-12%;animation-name:floatup}
@keyframes fall{to{transform:translateY(125vh) rotate(360deg)}}@keyframes floatup{to{transform:translateY(-130vh)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{@page{size:A4;margin:14mm}body{background:#fff;color:#000;font-size:12pt}nav,.bar2,.noprint,.hero p,.subnav{display:none!important}.top,.hero,.big,.bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sc,.card,.st{break-inside:avoid}main{padding:0}footer{font-size:10pt}}
</style>
</head>

const te=new TextEncoder(),u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),b6=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function kdf(pin,salt){const m=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(tk,pin){const s=crypto.getRandomValues(new Uint8Array(16)),i=crypto.getRandomValues(new Uint8Array(12));return{s:b6(s),i:b6(i),c:b6(await crypto.subtle.encrypt({name:'AES-GCM',iv:i},await kdf(pin,s),te.encode(tk)))}}
async function dec(k,pin){try{return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(k.i)},await kdf(pin,u8(k.s)),u8(k.c)))}catch(e){return null}}
const H=tk=>({Accept:'application/vnd.github+json',Authorization:'Bearer '+tk,'X-GitHub-Api-Version':'2022-11-28'});
const FURL=()=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
function load(data,sha){const l=D.logo;D=data;D.logo=l;if(!edit)restoreMe();SNAP=JSON.stringify(strip(D));if(sha!==undefined)SHA=sha}
async function ghGet(){const r=await fetch(FURL()+(BR?'?ref='+encodeURIComponent(BR):''),{headers:H(TOKEN),cache:'no-store'});if(r.status==404)return{data:null,sha:null};if(!r.ok)throw r.status;const j=await r.json();return{data:JSON.parse(b64d(j.content)),sha:j.sha}}
async function ghLogin(tk){try{const r=await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`,{headers:H(tk),cache:'no-store'});
 if(r.status==401)return'الرمز غير صحيح أو منتهي';if(r.status==404)return'لا يملك الرمز صلاحية على هذا المستودع';if(!r.ok)return'تعذر التحقق من الرمز ('+r.status+')';
 const j=await r.json();if(j.permissions&&j.permissions.push===false)return'الرمز للقراءة فقط. اجعل Contents على Read and write';BR=j.default_branch||'main';return''}catch(e){return'تعذر الاتصال بـ GitHub، حاول مرة أخرى'}}
async function enter(tk){out='جارٍ التحقق…';draw();
 if(CLOUD){const m=await ghLogin(tk);if(m){out=m;draw();return}TOKEN=tk;try{const r=await ghGet();SHA=r.sha;if(r.data)load(r.data)}catch(e){TOKEN='';out='تعذر قراءة بيانات البرنامج ('+e+')';draw();return}}else TOKEN=tk;
 edit=true;out='';ST='';stMsg='';
 if(CLOUD&&(D.rev||0)<(SEED.rev||0)){while(D.g.length>SEED.g.length)delGroup(D.g.length-1);while(D.g.length<SEED.g.length)D.g.push(SEED.g[D.g.length]);
  const old=D.s,map={},ni={};D.s=SEED.s.map((s,j)=>{const o=old.findIndex(x=>x.n===s.n);if(o>=0)map[o]=j;return{n:s.n,g:s.g}});
  for(const key in D.i){const[t,i]=key.split('_');if(map[i]!=null)ni[t+'_'+map[i]]=D.i[key]}D.i=ni;D.rev=SEED.rev;me=0;dirt()}
 try{if(remember)localStorage.setItem('samil_tk',tk);else localStorage.removeItem('samil_tk');SAVED=remember?tk:''}catch(e){}
 draw()}
async function pull(silent){if(!CLOUD)return;if(silent&&(dirty||saving||$('input:focus,textarea:focus,select:focus')))return;
 if(!silent){busy=true;err='';draw()}
 try{let data=null,sha;if(edit&&TOKEN){const r=await ghGet();data=r.data;sha=r.sha}else{const r=await fetch(CFG.path+'?t='+Date.now(),{cache:'no-store'});if(r.status==404)data=null;else if(!r.ok)throw r.status;else data=await r.json()}
  busy=false;err='';const ch=data&&JSON.stringify(strip(data))!==SNAP;if(ch)load(data,sha);else if(sha)SHA=sha;if(ch||!silent)draw()}
 catch(e){busy=false;if(!silent){err='تعذر تحميل النقاط. تحقق من الاتصال ثم أعد المحاولة.';draw()}}}
const sched=()=>{clearTimeout(timer);timer=setTimeout(save,SAVE_MS)};
function dirt(){dirty=true;if(ST!='saving')ST='';out='';updBar();sched()}
async function save(){if(!CLOUD||!edit)return;if(saving){again=true;return}clearTimeout(timer);if(!dirty&&ST!='err')return;
 saving=true;ST='saving';updBar();
 try{D.at=new Date().toISOString();const str=JSON.stringify(strip(D)),body={message:'تحديث نقاط صامل',content:b64e(str)};if(SHA)body.sha=SHA;if(BR)body.branch=BR;
  const r=await fetch(FURL(),{method:'PUT',headers:{...H(TOKEN),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){const j=await r.json();SHA=j.content.sha;SNAP=str;dirty=JSON.stringify(strip(D))!==str;ST='';stMsg='آخر حفظ: '+new Date().toLocaleTimeString('ar-QA-u-nu-latn',{hour:'2-digit',minute:'2-digit'})}
  else if(r.status==409||r.status==422){const g=await ghGet();SHA=g.sha;if(g.data)load(g.data);dirty=false;ST='info';stMsg='عدّل مشرف آخر في الوقت نفسه، فحُمّلت أحدث نسخة. كرّر آخر تعديل إن لم تجده.';saving=false;draw();return}
